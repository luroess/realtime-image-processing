name: cli

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rtl/**"
      - "testbench/**"
      - ".github/workflows/cli.yml"
  push:
    branches:
      - main
    paths:
      - "rtl/**"
      - "testbench/**"
      - ".github/workflows/cli.yml"

jobs:
  quick-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: testbench
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install GHDL
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync testbench environment
        run: uv sync

      - name: Run quick tier only
        run: uv run pytest -q -m fast pytest/test_pipeline_fast.py::test_pipeline_fast_tier_targets
