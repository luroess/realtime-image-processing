[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testbench"
version = "0.1.0"
description = "Cocotb verification environment for AXI4-Video FPGA blocks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cocotb>=2.0.1",
    "cocotbext-axi>=0.1.26",
    "numpy>=2.2.2",
    "opencv-python-headless>=4.13.0.0",
    "pillow>=11.1.0",
    "plotly>=6.3.0",
    "pytest>=9.0.2",
]

[project.scripts]
    tb-sim = "sim.run:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = [
    "sim*",
    "common*",
    "drivers*",
    "models*",
    "monitors*",
    "stimuli*",
    "verification*",
    "tests*",
]
exclude = ["sim_build*", "images*"]


[tool.pytest.ini_options]
testpaths = ["pytest"]
python_files = ["test_pipeline_*.py"]
addopts = ["--strict-markers"]
markers = [
    "fast: quick cocotb wrapper tier for core pipeline targets",
    "heavy: stress-oriented cocotb wrapper tier",
]
