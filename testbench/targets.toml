  [[targets.axi_gray_blurr_sobel_overlay_pipeline_vivado_ip_questa.build_stages]]
  name = "top"
  hdl_library = "top"
  build_args = ["-2008"]
  sources = [
    "rtl/FRAME_COMPOSITOR/ip/edit_FrameCompositor.gen/sources_1/ip/c_shift_ram_0/sim/c_shift_ram_0.vhd",
    "rtl/RGB_TO_GRAYSCALE/hdl/rgb_to_grayscale.vhd",
    "rtl/RGB_TO_GRAYSCALE/hdl/axi_rgb_to_grayscale.vhd",
    "rtl/DEBOUNCER/hdl/debouncing.vhd",
